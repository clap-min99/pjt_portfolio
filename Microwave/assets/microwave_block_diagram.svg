<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1250" viewBox="0 0 2000 1250">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#198b35"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:24px;font-weight:bold}.name{font-size:19px}.pin{font-size:15px}.small{font-size:15px;fill:#555}.block{fill:#ffffd0;stroke:#333;stroke-width:1.5}.mod{fill:#e2edf9;stroke:#333;stroke-width:1.5}.wire{fill:none;stroke:#169332;stroke-width:2;marker-end:url(#arrow)}.tag{font-size:14px;fill:#168032}</style></defs>
<rect width="2000" height="1250" fill="#fff"/><text x="1000" y="45" text-anchor="middle" class="title">microwave — functional block diagram</text>
<rect x="170" y="80" width="1630" height="1020" fill="none" stroke="#bbb" stroke-width="1.5"/><text x="185" y="105" class="small">top</text>
<text x="28" y="225" class="pin">rotary_s1 / s2 / key</text><text x="28" y="540" class="pin">start / cancel / door</text><text x="28" y="965" class="pin">motor_speed[1:0]</text><text x="28" y="1050" class="pin">clk / reset</text>
<rect x="220" y="160" width="240" height="145" class="mod"/><text x="340" y="148" text-anchor="middle" class="name">rotary input conditioning</text><text x="230" y="200" class="pin">s1 / s2 / key</text><text x="450" y="240" text-anchor="end" class="pin">clean signals</text><text x="340" y="282" text-anchor="middle" class="small">sync + debounce</text>
<rect x="220" y="490" width="240" height="145" class="mod"/><text x="340" y="478" text-anchor="middle" class="name">button input conditioning</text><text x="230" y="530" class="pin">start / cancel / door</text><text x="450" y="570" text-anchor="end" class="pin">button pulses</text><text x="340" y="612" text-anchor="middle" class="small">sync + debounce</text>
<rect x="555" y="160" width="230" height="145" class="mod"/><text x="670" y="148" text-anchor="middle" class="name">u_rotary : rotary</text><text x="565" y="200" class="pin">s1 / s2 / key</text><text x="775" y="240" text-anchor="end" class="pin">key_led</text><text x="670" y="282" text-anchor="middle" class="small">selection state</text>
<rect x="555" y="345" width="260" height="170" class="block"/><text x="685" y="333" text-anchor="middle" class="name">time / run control</text><text x="565" y="380" class="pin">rotary steps</text><text x="565" y="415" class="pin">buttons</text><text x="565" y="450" class="pin">door state</text><text x="805" y="480" text-anchor="end" class="pin">time / running / finished</text><text x="685" y="538" text-anchor="middle" class="small">logic in top</text>
<rect x="555" y="650" width="260" height="120" class="block"/><text x="685" y="638" text-anchor="middle" class="name">door control</text><text x="565" y="685" class="pin">door button</text><text x="565" y="720" class="pin">running / finished</text><text x="805" y="750" text-anchor="end" class="pin">door_open</text>
<rect x="1000" y="155" width="270" height="130" class="block"/><text x="1135" y="143" text-anchor="middle" class="name">display selection</text><text x="1010" y="195" class="pin">time / running / finished</text><text x="1260" y="255" text-anchor="end" class="pin">bcd / animation</text>
<rect x="1480" y="155" width="260" height="130" class="mod"/><text x="1610" y="143" text-anchor="middle" class="name">u_fnd : fnd_controller</text><text x="1490" y="195" class="pin">bcd / animation</text><text x="1730" y="255" text-anchor="end" class="pin">an / seg</text>
<rect x="1480" y="365" width="260" height="110" class="block"/><text x="1610" y="353" text-anchor="middle" class="name">buzzer generator</text><text x="1490" y="405" class="pin">button / finished</text><text x="1730" y="450" text-anchor="end" class="pin">buzzer</text>
<rect x="1480" y="575" width="260" height="110" class="block"/><text x="1610" y="563" text-anchor="middle" class="name">servo PWM</text><text x="1490" y="615" class="pin">door_open</text><text x="1730" y="660" text-anchor="end" class="pin">servo_pwm</text>
<rect x="1480" y="815" width="260" height="145" class="block"/><text x="1610" y="803" text-anchor="middle" class="name">motor PWM</text><text x="1490" y="855" class="pin">running</text><text x="1490" y="890" class="pin">speed</text><text x="1730" y="935" text-anchor="end" class="pin">PWM / IN1 / IN2</text>
<rect x="1000" y="930" width="270" height="100" class="mod"/><text x="1135" y="918" text-anchor="middle" class="name">u_tick_1ms : tick_generator</text><text x="1010" y="975" class="pin">clk / reset</text><text x="1260" y="1005" text-anchor="end" class="pin">tick_1ms</text>
<path class="wire" d="M180 220 H220"/><path class="wire" d="M180 535 H220"/><path class="wire" d="M460 220 H555"/>
<path class="wire" d="M485 220 V380 H555"/><path class="wire" d="M460 550 H500 V415 H555"/><path class="wire" d="M475 550 V685 H555"/>
<path class="wire" d="M785 220 H870 V115 H1830"/><text x="1840" y="120" class="pin">key_led</text>
<path class="wire" d="M815 365 H880 V195 H1000"/><path class="wire" d="M1270 220 H1480"/><path class="wire" d="M1740 220 H1830"/><text x="1840" y="225" class="pin">an / seg</text>
<path class="wire" d="M815 395 H930 V405 H1480"/><path class="wire" d="M1740 420 H1830"/><text x="1840" y="425" class="pin">buzzer</text>
<path class="wire" d="M815 700 H960 V615 H1480"/><path class="wire" d="M1740 630 H1830"/><text x="1840" y="635" class="pin">servo_pwm</text>
<path class="wire" d="M815 425 H965 V855 H1480"/><path class="wire" d="M150 960 H200 V890 H1480"/><path class="wire" d="M1740 880 H1830"/><text x="1840" y="874" class="pin">motor_pwm</text><text x="1840" y="897" class="pin">motor_in1 / in2</text>
<path class="wire" d="M150 1045 H955 V975 H1000"/>
<text x="200" y="1150" class="small">Blue: instantiated modules / input conditioning. Yellow: functional logic inside top.</text>
<text x="200" y="1180" class="small">Common clk, reset, tick and some feedback connections are omitted for readability.</text>
</svg>
